esphome:
  friendly_name: Mini-TV Office

# ==============================================================================
# MiniTV — "Kristallwürfel" device configuration
# ==============================================================================
#
# Target hardware: GeekMagic Mini-TV Kristallwürfel (ESP8266 / d1_mini /
#                  ESP-12F) behind a mirrored/prism cube enclosure.
# Display:         ST7789V 240×240 SPI panel
# Purpose:         Clock display with Home Assistant push-alert overlay and
#                  waste-collection reminder icons.
#
# All hardware wiring, display rendering, waste-calendar polling and alert
# logic shared by every MiniTV unit lives in the package
# src/common/minitv-common.yaml. This file only supplies the values that are
# unique to *this* physical device. To set up another unit (different
# enclosure/IP/name), copy src/templates/new-device.yaml.example instead of
# duplicating this file.
#
# Quickstart:
#   1. Add wifi_ssid, wifi_password and wifi_recover_password to secrets.yaml.
#   2. Add ha_token to secrets.yaml — a Home Assistant Long-Lived Access
#      Token, formatted as the full HTTP header value:
#        ha_token: "Bearer <your-long-lived-access-token>"
#      Used by the device to poll the waste-collection calendar over the
#      Home Assistant REST API (see src/common/minitv-common.yaml).
#   3. Flash:  esphome run src/minitv/MiniTV.yaml
#   4. Trigger an alert from a Home Assistant automation:
#        service: esphome.minitv_trigger_alert
#        data:
#          alert_message: "Motion detected!"
#          alert_color_r: 255
#          alert_color_g: 200
#          alert_color_b: 0
#          alert_font_black: false
# ==============================================================================

substitutions:
  device_name:          "minitv"
  friendly_name:        "Blade TV"
  static_ip:            "192.168.224.79"
  mirror_x:             "true"   # Cube enclosure mirrors the panel horizontally.
  ha_base_url:          "http://192.168.223.101"
  ha_calendar_entity:   "calendar.ics"

packages:
  common: !include ./common/minitv-common.yaml
