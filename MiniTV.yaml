esphome:
  name: minitv
  friendly_name: GeekMagic Mini-TV
  on_boot:
    priority: 800
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%

esp8266:
  board: d1_mini

globals:
  - id: alert_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: alert_text
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: alert_start_time
    type: uint32_t
    restore_value: no
    initial_value: '0'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  manual_ip:
    static_ip: 192.168.223.79
    gateway: 192.168.223.1
    subnet: 255.255.255.0
    dns1: 9.9.9.9
    dns2: 8.8.8.8
  ap:
    ssid: "MiniTV Recovery"
    password: "Recover1234"

captive_portal:

web_server:
  port: 80

#enable HA API
api:
  services:
    - service: trigger_alert
      variables:
        alert_message: string
      then:
        - globals.set:
            id: alert_text
            value: !lambda 'return alert_message;'
        - globals.set:
            id: alert_active
            value: 'true'
        - globals.set:
            id: alert_start_time
            value: !lambda 'return millis();'

ota:
  - platform: esphome

#enable logger
logger:

time:
  - platform: homeassistant
    id: ha_time

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  interface: hardware
  id: spihwd

font:
  - file: "gfonts://Roboto Mono"
    id: clock_font
    size: 32
  - file: "gfonts://Roboto Mono"
    id: alert_font
    size: 32

output:
  - platform: esp8266_pwm
    pin: GPIO5
    frequency: 20000 Hz
    id: bl_pwm
    inverted: true

light:
  - platform: monochromatic
    id: backlight
    name: "MiniTV Backlight"
    output: bl_pwm
    default_transition_length: 0s
    restore_mode: ALWAYS_ON

display:  
  - platform: mipi_spi
    model: st7789v
    data_rate: 40Mhz
    draw_rounding: 1
    spi_id: spihwd
    dimensions: {height: 240, width: 240, offset_height: 0, offset_width: 0}
    # use_axis_flips: true
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false
    invert_colors: true
    dc_pin: GPIO00
    reset_pin: GPIO02
    color_depth: 16
    spi_mode: mode3
    lambda: |-
      const int cx = it.get_width() / 2;
      const int cy = it.get_height() / 2;
      uint32_t current_time = millis();
      uint32_t alert_elapsed = current_time - id(alert_start_time);

      // Clear alert if 5000ms (5 seconds) have elapsed
      if (id(alert_active) && alert_elapsed >= 5000) {
        id(alert_active) = false;
      }

      // Render yellow alert if active
      if (id(alert_active)) {
        if ((current_time%2000) < 1000) {  // Blink every 500ms
          it.fill(Color(200, 255, 0));  // Bright yellow background
          it.printf(cx, cy, id(alert_font), Color(0, 0, 0), TextAlign::CENTER, id(alert_text).c_str());
          return;
        }
        else {
          it.fill(Color(0, 0, 0));  // black background
          it.printf(cx, cy, id(alert_font), Color(255, 255, 255), TextAlign::CENTER, id(alert_text).c_str());
          return;
        }
      }

      // Normal clock display
      it.fill(Color(0, 0, 0));  // Black background
      auto now = id(ha_time).now();
      if (!now.is_valid()) {
        it.printf(cx, cy, id(clock_font), Color(255, 255, 255), TextAlign::CENTER, "Syncing");
        return;
      }

      it.strftime(cx, cy, id(clock_font), Color(255, 255, 255), TextAlign::CENTER, "%H:%M:%S", now);